name: CI

# Build-check on every push/PR so packaging regressions (e.g. the
# google-genai namespace-package issue documented in package.sh) are
# caught before they'd only surface at release time. Runs the exact same
# package.sh used locally and by the release workflow, so this is a true
# smoke test of the release pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile
        run: python3 -m py_compile main.py setup.py eqclip/*.py

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build and package
        run: ./package.sh

      - name: Verify DMG was produced
        run: test -f dist/EqClip-*.dmg || (echo "::error::no DMG produced" && exit 1)
