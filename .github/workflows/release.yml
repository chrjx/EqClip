name: Release

# Tag a commit `vX.Y.Z` (matching eqclip/__version__.py) and push the tag
# to build EqClip.app, package it as a DMG, and publish it as a GitHub
# Release, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so --generate-notes can find the previous tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches eqclip/__version__.py
        run: |
          PKG_VERSION="$(python3 -c 'from eqclip.__version__ import __version__; print(__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match eqclip/__version__.py ($PKG_VERSION). Bump the version file first."
            exit 1
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build and package (same script used for local packaging)
        run: ./package.sh

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/EqClip-*.dmg \
            --title "EqClip ${GITHUB_REF_NAME}" \
            --generate-notes
